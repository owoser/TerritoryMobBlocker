name: Release

# 打 tag 即发布：推送 v1.2.3 会自动构建、打包并创建 / 更新对应 Release。
# ⚠ 暂时只保留手动触发（workflow_dispatch），原因见文件末尾的「已知阻塞」说明。
# 阻塞解除后，把下面注释掉的触发条件恢复即可：
#   push:
#     tags:
#       - "v*"
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (windows-x64)
    # windows-2022 = VS 2022 / MSVC 14.44。
    # windows-latest 现在是 VS 2026（MSVC 14.51），其 STL 对不完整类型的 unique_ptr
    # 检查更严格，会直接让 LeviLamina 26.51.6 的 MinecraftCommands 析构报错：
    #   error: invalid application of 'sizeof' to an incomplete type 'CommandRegistry'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      # 工具链必须成对匹配：
      #   - MSVC 14.44（VS 2022）的 STL 要求 Clang >= 19；
      #   - clang 19 又是唯一能编过 LeviLamina 26.51.6 的版本（clang 22 会让
      #     MinecraftCommands 的 unique_ptr<CommandRegistry> 触发 incomplete type 断言）。
      # 本地验证通过的组合正是 MSVC 14.44 + clang 19.1.5。
      - name: Install LLVM 19 (clang-cl)
        run: choco install llvm --version=19.1.5 -y --no-progress --allow-downgrade

      - name: Show toolchain
        shell: pwsh
        run: |
          xmake --version
          clang-cl --version

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-v2-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-v2-${{ runner.os }}-

      - name: Update xmake repositories
        run: xmake repo -u

      - name: Configure
        run: xmake f -p windows -a x64 -m release --toolchain=clang-cl -y
        env:
          TMB_VERSION: ${{ github.ref_name }}

      - name: Build
        run: xmake -y
        env:
          TMB_VERSION: ${{ github.ref_name }}

      - name: Dump install logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA '.xmake\cache\packages'
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -Filter install.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Tail 300
            }
          }

      # bin/ 里同时有 .pdb，发布包只需要 dll + manifest.json
      - name: Package (TerritoryMobBlocker/{dll,manifest.json})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/TerritoryMobBlocker | Out-Null
          Copy-Item bin/TerritoryMobBlocker/TerritoryMobBlocker.dll package/TerritoryMobBlocker/
          Copy-Item bin/TerritoryMobBlocker/manifest.json           package/TerritoryMobBlocker/
          Get-ChildItem -Recurse package | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerritoryMobBlocker-windows-x64
          path: package/TerritoryMobBlocker
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TerritoryMobBlocker-windows-x64
          path: package/TerritoryMobBlocker

      # 从 CHANGELOG.md 里取当前版本段落作为 Release 正文
      - name: Extract release notes
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" { found = 1; next }
            found && /^##[[:space:]]/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md 中没有找到 $VERSION 段落，使用占位说明"
            printf 'TerritoryMobBlocker %s\n\n详见 [CHANGELOG.md](CHANGELOG.md)。\n' "$VERSION" > release_notes.md
          fi
          echo '--- release notes ---'
          cat release_notes.md

      - name: Package zip
        run: |
          set -euo pipefail
          cd package
          zip -r "../TerritoryMobBlocker-${VERSION}.zip" TerritoryMobBlocker
          cd ..
          unzip -l "TerritoryMobBlocker-${VERSION}.zip"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: TerritoryMobBlocker ${{ env.VERSION }}
          body_path: release_notes.md
          files: TerritoryMobBlocker-${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
          # v1.1.0-beta.1 这类带连字符的 tag 自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false

# ─────────────────────────────────────────────────────────────────────────────
# 已知阻塞（截至 2026-10-29）
#
# CI 卡在 `xmake f` 的第一步：构建依赖 levilamina 26.51.6 的 SDK 时失败。
# 这不是本项目的问题，而是上游源码在现代 MSVC STL 下无法编译：
#
#   src/mc/server/commands/MinecraftCommands.h 用
#     ::ll::TypedStorage<8, 8, ::std::unique_ptr<T>>
#   保存了 T 只做前向声明的成员（CommandRegistry / CommandOutputSender /
#   Command / DeferredCommandBase），同时又有 `virtual ~MinecraftCommands() = default;`。
#   一旦某个 TU 实例化该析构函数（例如 ExecuteCommandEvent.cpp 里的
#   LL_TYPE_INSTANCE_HOOK），MSVC STL 的 default_delete 就会断言：
#
#     error: invalid application of 'sizeof' to an incomplete type '...'
#
# 复现条件与编译器版本无关：clang 19 / clang 22、MSVC 14.44 / 14.51 均可复现，
# 本地把 SDK 删掉重建同样失败（说明现有可用 SDK 是历史产物）。
#
# 可行的解法（择一，需要时再实施）：
#   1. 等上游修复 MinecraftCommands.h 的 include，然后用官方 levimc-repo 正常构建；
#   2. 在 CI 里用「本地补丁包」（add_repositories 指向自建 repo，构建前补 include）——
#      已验证可让 CommandRegistry / CommandOutputSender 通过，但会逐个暴露下一个
#      同样写法的类，属于打地鼠，不推荐；
#   3. 把一份已构建好的 SDK（include + lib，约 50 MB / 压缩后约 10 MB）作为本仓库
#      Release 资产分发，CI 下载后跳过源码构建（需要同时接管 linkrule 的 prelink 步骤）。
#
# 在阻塞解除前，本工作流保持为手动触发，避免 main 分支长期红灯。
# ─────────────────────────────────────────────────────────────────────────────
