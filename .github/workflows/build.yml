name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-x64)
    # windows-2022 = VS 2022 / MSVC 14.44，与本地验证通过的工具链一致。
    # 注意：LeviLamina SDK 不走源码构建（上游 26.51.x 在现代 MSVC STL 下编译不过），
    # 改由本仓库 Release 分发预编译 SDK，见 xmake-repo-extra/packages/l/levilamina/xmake.lua。
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install LLVM 19 (clang-cl)
        run: choco install llvm --version=19.1.5 -y --no-progress --allow-downgrade

      - name: Show toolchain
        shell: pwsh
        run: |
          xmake --version
          clang-cl --version

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-v3-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake-repo-extra/**/xmake.lua') }}
          restore-keys: |
            xmake-v3-${{ runner.os }}-

      - name: Update xmake repositories
        run: xmake repo -u

      - name: Configure
        run: xmake f -p windows -a x64 -m release --toolchain=clang-cl -y

      - name: Build
        run: xmake -y

      # 依赖包构建失败时，真正的错误只写进 xmake 的 install.txt，GitHub 日志里只显示
      # "install failed!"，所以失败时把它导出来。
      - name: Dump install logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA '.xmake\cache\packages'
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -Filter install.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Tail 300
            }
          } else {
            Write-Host "未找到 xmake 包安装日志目录：$root"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerritoryMobBlocker-windows-x64
          path: |
            bin/TerritoryMobBlocker/TerritoryMobBlocker.dll
            bin/TerritoryMobBlocker/manifest.json
          if-no-files-found: error
