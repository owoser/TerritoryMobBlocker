name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      # 与本地验证过的工具链保持一致：LeviLamina 26.51.6 的 SDK 源码在 clang 19 下可正常构建，
      # 更新的 clang 会因源码中的 `typename` 用法告警/报错而失败，故显式锁定版本。
      - name: Install LLVM 19 (clang-cl)
        run: choco install llvm --version=19.1.5 -y --no-progress --allow-downgrade

      - name: Show toolchain
        shell: pwsh
        run: |
          xmake --version
          clang-cl --version

      # LeviLamina SDK 需要源码构建，缓存 xmake 包目录可把后续构建从数十分钟降到分钟级
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-v2-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-v2-${{ runner.os }}-

      - name: Update xmake repositories
        run: xmake repo -u

      - name: Configure
        run: xmake f -p windows -a x64 -m release --toolchain=clang-cl -y

      - name: Build
        run: xmake -y

      # 依赖包（尤其 LeviLamina SDK）构建失败时，真正的错误只写在这个文件里
      - name: Dump install logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA '.xmake\cache\packages'
          if (Test-Path $root) {
            Get-ChildItem $root -Recurse -Filter install.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Tail 300
            }
          } else {
            Write-Host "未找到 xmake 包安装日志目录：$root"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerritoryMobBlocker-windows-x64
          path: |
            bin/TerritoryMobBlocker/TerritoryMobBlocker.dll
            bin/TerritoryMobBlocker/manifest.json
          if-no-files-found: error
